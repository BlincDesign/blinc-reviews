# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "c41c9baff0b915d3c5a42018e4f8eafc"
application_url = "https://blinc-reviews-app-production.up.railway.app"
embedded = true
name = "Blinc Reviews"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,read_locales,read_orders,read_themes,write_metaobject_definitions,write_metaobjects,write_products"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/fulfilled"
  topics = [ "orders/fulfilled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[app_proxy]
url = "https://blinc-reviews-app-production.up.railway.app/proxy"
subpath = "blinc-reviews"
prefix = "apps"

[auth]
redirect_urls = [ "https://blinc-reviews-app-production.up.railway.app/api/auth" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
